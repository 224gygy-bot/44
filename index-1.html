<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼬마 장기 학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column — header with two big mode tabs, then a lesson card or match panel sitting over a wooden janggi board. Two columns (panel | board) from 900px. */
:root{
  --bg:#E4F0EA; --surface:#FFFFFF; --ink:#1D2A25; --muted:#56695F; --line:#C6DACF;
  --wood:#EBC27A; --wood-edge:#C48F43; --grain:#6A4321; --palace:#F3D79C;
  --cho:#15774A; --han:#C42D38; --piece:#FFF6E0; --piece-edge:#8E6A36;
  --sun:#FFB51C; --sun-soft:#FFEDB8; --sun-ink:#5A3D00;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-lg:22px; --r-md:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A15; --surface:#16261F; --ink:#E8F2ED; --muted:#9BB2A7; --line:#2A4136;
  --wood:#D9AC5F; --wood-edge:#9E6F2D; --grain:#4E3015; --palace:#E6C27F;
  --sun-soft:#3D3112; --sun-ink:#FFE19A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1A15; --surface:#16261F; --ink:#E8F2ED; --muted:#9BB2A7; --line:#2A4136;
  --wood:#D9AC5F; --wood-edge:#9E6F2D; --grain:#4E3015; --palace:#E6C27F;
  --sun-soft:#3D3112; --sun-ink:#FFE19A; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:-.01em}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:-4px}
.tabs{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;font-family:var(--display);font-size:19px;padding:8px 20px;border-radius:999px;min-height:46px}
.tabs button[aria-pressed="true"]{background:var(--cho);color:#fff}

.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
#learn{grid-template-areas:"info" "status" "board" "ctrl"}
#play{grid-template-areas:"info" "board" "ctrl" "opt"}
.a-info{grid-area:info}.a-status{grid-area:status}.a-board{grid-area:board}.a-ctrl{grid-area:ctrl}.a-opt{grid-area:opt}
@media (min-width:900px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:16px 24px}
  #learn{grid-template-areas:"info board" "status board" "ctrl board";grid-template-rows:auto auto 1fr}
  #play{grid-template-areas:"info board" "ctrl board" "opt board";grid-template-rows:auto auto 1fr}
}
.stage[hidden]{display:none}
[hidden]{display:none!important}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn.sm{min-height:40px;padding:6px 12px;font-size:16px}
.btn.sm svg{width:18px;height:18px}
@media (max-width:899px){
  body{padding-block:10px 32px}
  .wrap{gap:10px}
  .brand svg{width:34px;height:34px}
  .brand h1{font-size:22px}
  .brand small{display:none}
  .tabs{width:100%}
  .tabs button{flex:1;min-height:44px;padding:6px 10px;font-size:18px}
  .card{padding:12px 14px;gap:6px}
  .card h2{font-size:22px}
  .lesson-text{font-size:16px;line-height:1.55}
  .chip{min-height:38px}
  .a-ctrl.row{justify-content:space-between}
  .a-ctrl.row .btn{flex:1;justify-content:center}
}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:16px;min-height:42px}
.chip .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:14px}
.chip.done .n{background:var(--sun);color:#3A2600}
.chip[aria-current="true"]{border-color:var(--cho);box-shadow:0 0 0 2px var(--cho) inset}

.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
.lesson-text{font-size:19px;line-height:1.65;margin:0;max-width:34em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 16px;min-height:48px;font-family:var(--display);font-size:18px;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--cho);border-color:var(--cho);color:#fff}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ready{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.btn svg{width:22px;height:22px}

.status{background:var(--sun-soft);color:var(--sun-ink);border-radius:var(--r-md);padding:10px 14px;font-size:17px;line-height:1.4;min-height:76px;display:flex;align-items:center;gap:10px}
.s-icon svg{width:52px;height:52px;display:block}
.s-icon{flex:0 0 52px}
.status.good{background:var(--cho);color:#fff}
.status.warn{background:var(--han);color:#fff}
.stars-count{font-family:var(--display);font-size:20px;margin-left:auto;white-space:nowrap}

.status b{font-family:var(--display);font-weight:400;font-size:19px}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:8px 14px;min-height:48px;font-family:var(--display);font-size:17px}
.seg button[aria-pressed="true"]{border-color:var(--cho);background:var(--cho);color:#fff}
.label{font-family:var(--display);font-size:16px;color:var(--muted)}
.turn{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:24px}
.dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto}
.dot.cho{background:var(--cho)} .dot.han{background:var(--han)}
.tray{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;align-items:center}
.tray .mini{width:30px;height:30px}
.tray-label{font-size:14px;color:var(--muted);width:100%}
.toggle{display:flex;align-items:center;gap:10px;font-size:17px;min-height:44px}
.toggle input{width:24px;height:24px;accent-color:var(--cho)}

.board-wrap{position:relative;width:100%;max-width:520px;margin:0 auto}
svg.board{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.b-wood{fill:var(--wood);stroke:var(--wood-edge);stroke-width:10}
.b-palace{fill:var(--palace)}
.b-lines line{stroke:var(--grain);stroke-width:3}
.b-edge{fill:none;stroke:var(--grain);stroke-width:6}
.b-mark{stroke:var(--grain);stroke-width:3;fill:none}
.b-coord{fill:var(--grain);opacity:.55;font:22px var(--display);text-anchor:middle}
.pc{transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.pc-face{fill:var(--piece);stroke:var(--piece-edge);stroke-width:4}
.pc-shadow{fill:#000;opacity:.22}
.pc text{font-family:var(--display);text-anchor:middle;dominant-baseline:central}
.cho .pc-in{stroke:var(--cho)} .han .pc-in{stroke:var(--han)}
.pc-in{fill:none;stroke-width:3}
.cho text{fill:var(--cho)} .han text{fill:var(--han)}
.pc.lifted{transform-origin:center}
.hint-dot{fill:var(--sun);stroke:#fff;stroke-width:4}
.hint-ring{fill:none;stroke:var(--sun);stroke-width:8;stroke-dasharray:14 8}
.sel-halo{fill:var(--sun);opacity:.55}
.last{fill:none;stroke:var(--cho);stroke-width:4;stroke-dasharray:6 8;opacity:.8}
.check-ring{fill:none;stroke:var(--han);stroke-width:8;animation:pulse 0.9s ease-in-out infinite}
.glow{fill:var(--sun);stroke:var(--sun);stroke-width:6;animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:.2}}
.star{fill:var(--sun);stroke:#9A6400;stroke-width:3;animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{50%{transform:scale(1.15) rotate(8deg)}}
@keyframes pulse{50%{opacity:.35}}

.overlay{position:fixed;inset:0;background:rgba(10,20,15,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:28px;padding:28px 24px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal h3{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.modal p{margin:0;font-size:18px;color:var(--muted)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.foot{font-size:14px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.pc{transition:none}.star,.check-ring,.btn.ready,.glow{animation:none}}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="46" height="46" viewBox="-50 -50 100 100" aria-hidden="true"><polygon class="pc-face" points="43,18 18,43 -18,43 -43,18 -43,-18 -18,-43 18,-43 43,-18"/><polygon points="36,15 15,36 -15,36 -36,15 -36,-15 -15,-36 15,-36 36,-15" fill="none" stroke="var(--cho)" stroke-width="4"/><text x="0" y="2" text-anchor="middle" dominant-baseline="central" font-family="Jua, sans-serif" font-size="44" fill="var(--cho)">장</text></svg>
      <div><h1>꼬마 장기 학교</h1><small>유치원생부터 초등 3학년까지</small></div>
    </div>
    <nav class="tabs" aria-label="모드">
      <button id="tabLearn" aria-pressed="true">배우기</button>
      <button id="tabPlay" aria-pressed="false">대련하기</button>
    </nav>
  </header>

  <!-- 배우기 -->
  <section id="learn" class="stage">
    <div class="panel a-info">
      <div class="chips" id="chips" role="list"></div>
      <div class="card">
        <div class="top-row">
          <div class="eyebrow" id="lEyebrow"></div>
          <div class="row">
            <button class="btn sm" id="lSpeak" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>읽어줘</button>
            <button class="btn sm" id="lHint" type="button">힌트</button>
          </div>
        </div>
        <h2 id="lTitle"></h2>
        <p class="lesson-text" id="lText"></p>
      </div>
    </div>
    <div class="status a-status" id="lStatus" aria-live="polite"><span class="s-icon" id="lIcon" hidden></span><span id="lMsg"></span><span class="stars-count" id="lCount"></span></div>
    <div class="board-wrap a-board"><svg class="board" id="lBoard" aria-label="장기판"></svg></div>
    <div class="row a-ctrl">
      <button class="btn" id="lReset" type="button">처음부터</button>
      <button class="btn primary" id="lNext" type="button" disabled>다음 수업 →</button>
    </div>
  </section>

  <!-- 대련하기 -->
  <section id="play" class="stage" hidden>
    <div class="card a-info">
      <div class="turn"><span class="dot cho" id="turnDot"></span><span id="turnText">초록 팀 차례</span></div>
      <div class="status" id="gStatus" aria-live="polite"><span id="gMsg">초록 팀(초)이 먼저 시작해요. 움직일 말을 눌러 보세요.</span></div>
    </div>
    <div class="board-wrap a-board"><svg class="board" id="gBoard" aria-label="장기판"></svg></div>
    <div class="card a-ctrl">
      <div class="row">
        <button class="btn" id="gUndo" type="button">무르기</button>
        <button class="btn" id="gNew" type="button">새 게임</button>
      </div>
      <div>
        <div class="tray-label" id="trayChoLabel">초록 팀이 잡은 말</div><div class="tray" id="trayCho"></div>
        <div class="tray-label" id="trayHanLabel">빨간 팀이 잡은 말</div><div class="tray" id="trayHan"></div>
      </div>
    </div>
    <div class="card a-opt">
      <div class="label">누구랑 할까요? (바꾸면 새 게임이 시작돼요)</div>
      <div class="seg" id="oppSeg">
        <button data-opp="friend" aria-pressed="false">친구랑 (둘이서)</button>
        <button data-opp="easy" aria-pressed="true">컴퓨터 · 쉬움</button>
        <button data-opp="mid" aria-pressed="false">컴퓨터 · 중간</button>
        <button data-opp="normal" aria-pressed="false">컴퓨터 · 어려움</button>
      </div>
      <label class="toggle"><input type="checkbox" id="showHints" checked> 갈 수 있는 곳 보여주기</label>
    </div>
  </section>

  <p class="foot">초록 팀(초)은 아래쪽, 빨간 팀(한)은 위쪽이에요. 초록 팀이 먼저 둬요.</p>
</div>

<div class="overlay" id="winBox" hidden>
  <div class="modal">
    <svg width="90" height="90" viewBox="-50 -50 100 100" aria-hidden="true"><polygon points="0,-46 13,-15 46,-14 20,7 29,40 0,21 -29,40 -20,7 -46,-14 -13,-15" fill="var(--sun)" stroke="#9A6400" stroke-width="3"/></svg>
    <h3 id="winTitle">초록 팀 승리!</h3>
    <p id="winSub">외통이에요. 정말 멋져요!</p>
    <button class="btn primary" id="winAgain" type="button">한 판 더</button>
    <button class="btn" id="winClose" type="button">판 다시 보기</button>
  </div>
</div>
<canvas id="fx" hidden></canvas>

<script id="engine">
/* ===== 장기 규칙 엔진 ===== */
const VAL={K:0,R:13,C:7,N:5,B:3,A:3,P:2};
let UID=0;
const mk=(t,s)=>({t,s,id:++UID});
const enemy=s=>s==='cho'?'han':'cho';
const inB=(r,c)=>r>=0&&r<10&&c>=0&&c<9;
const inPalace=(r,c,s)=>c>=3&&c<=5&&(s==='cho'?r>=7:r<=2);
const PLINES=[[[0,3],[1,4],[2,5]],[[0,5],[1,4],[2,3]],[[7,3],[8,4],[9,5]],[[7,5],[8,4],[9,3]]];
const ORTH=[[1,0],[-1,0],[0,1],[0,-1]];
function linesAt(r,c){const o=[];for(const L of PLINES){const i=L.findIndex(p=>p[0]===r&&p[1]===c);if(i>=0)o.push([L,i]);}return o;}
const emptyBoard=()=>Array.from({length:10},()=>Array(9).fill(null));
const clone=b=>b.map(row=>row.slice());

function pseudo(b,r,c){
  const p=b[r][c]; if(!p) return []; const s=p.s, mv=[];
  const add=(tr,tc)=>{ if(!inB(tr,tc))return; const q=b[tr][tc]; if(!q||q.s!==s) mv.push([tr,tc]); };
  switch(p.t){
    case 'K': case 'A':
      for(const [dr,dc] of ORTH){const tr=r+dr,tc=c+dc; if(inPalace(tr,tc,s)) add(tr,tc);}
      for(const [L,i] of linesAt(r,c)) for(const j of [i-1,i+1]) if(j>=0&&j<3){const [tr,tc]=L[j]; if(inPalace(tr,tc,s)) add(tr,tc);}
      break;
    case 'P': { const f=s==='cho'?-1:1;
      add(r+f,c); add(r,c-1); add(r,c+1);
      for(const [L,i] of linesAt(r,c)) for(const j of [i-1,i+1]) if(j>=0&&j<3){const [tr,tc]=L[j]; if(tr===r+f) add(tr,tc);}
      break; }
    case 'R':
      for(const [dr,dc] of ORTH){let tr=r+dr,tc=c+dc; while(inB(tr,tc)){const q=b[tr][tc]; if(!q) mv.push([tr,tc]); else {if(q.s!==s) mv.push([tr,tc]); break;} tr+=dr;tc+=dc;}}
      for(const [L,i] of linesAt(r,c)) for(const d of [-1,1]){let j=i+d; while(j>=0&&j<3){const [tr,tc]=L[j],q=b[tr][tc]; if(!q) mv.push([tr,tc]); else {if(q.s!==s) mv.push([tr,tc]); break;} j+=d;}}
      break;
    case 'C':
      for(const [dr,dc] of ORTH){let tr=r+dr,tc=c+dc,jumped=false;
        while(inB(tr,tc)){const q=b[tr][tc];
          if(!jumped){ if(q){ if(q.t==='C') break; jumped=true; } }
          else { if(!q) mv.push([tr,tc]); else { if(q.s!==s&&q.t!=='C') mv.push([tr,tc]); break; } }
          tr+=dr;tc+=dc;}}
      for(const [L,i] of linesAt(r,c)) if(i!==1){const m=L[1],q=b[m[0]][m[1]];
        if(q&&q.t!=='C'){const [tr,tc]=L[2-i],t=b[tr][tc]; if(!t||(t.s!==s&&t.t!=='C')) mv.push([tr,tc]);}}
      break;
    case 'N':
      for(const [dr,dc] of ORTH){const lr=r+dr,lc=c+dc; if(!inB(lr,lc)||b[lr][lc]) continue;
        const sd=dr?[[dr,1],[dr,-1]]:[[1,dc],[-1,dc]];
        for(const [er,ec] of sd) add(lr+er,lc+ec);}
      break;
    case 'B':
      for(const [dr,dc] of ORTH){const lr=r+dr,lc=c+dc; if(!inB(lr,lc)||b[lr][lc]) continue;
        const sd=dr?[[dr,1],[dr,-1]]:[[1,dc],[-1,dc]];
        for(const [er,ec] of sd){const mr=lr+er,mc=lc+ec; if(!inB(mr,mc)||b[mr][mc]) continue; add(mr+er,mc+ec);}}
      break;
  }
  return mv;
}
function apply(b,fr,fc,tr,tc){const n=clone(b); n[tr][tc]=n[fr][fc]; n[fr][fc]=null; return n;}
function findKing(b,s){for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c]; if(p&&p.t==='K'&&p.s===s) return [r,c];} return null;}
function attacked(b,s){const k=findKing(b,s); if(!k) return false; const e=enemy(s);
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c]; if(p&&p.s===e){ for(const m of pseudo(b,r,c)) if(m[0]===k[0]&&m[1]===k[1]) return true; }}
  return false;}
function legal(b,r,c){const p=b[r][c]; if(!p) return []; return pseudo(b,r,c).filter(([tr,tc])=>!attacked(apply(b,r,c,tr,tc),p.s));}
function allLegal(b,s){const o=[];for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c]; if(p&&p.s===s) for(const m of legal(b,r,c)) o.push([r,c,m[0],m[1]]);} return o;}
function allPseudo(b,s){const o=[];for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c]; if(p&&p.s===s) for(const m of pseudo(b,r,c)) o.push([r,c,m[0],m[1]]);}
  o.sort((a,z)=>{const qa=b[a[2]][a[3]],qz=b[z[2]][z[3]]; return (qz?VAL[qz.t]+(qz.t==='K'?99:0):0)-(qa?VAL[qa.t]+(qa.t==='K'?99:0):0);}); return o;}
function startBoard(){
  const b=emptyBoard(); const back=['R','N','B','A',null,'A','B','N','R'];
  back.forEach((t,c)=>{ if(t){ b[0][c]=mk(t,'han'); b[9][c]=mk(t,'cho'); }});
  b[1][4]=mk('K','han'); b[8][4]=mk('K','cho');
  for(const c of [1,7]){ b[2][c]=mk('C','han'); b[7][c]=mk('C','cho'); }
  for(const c of [0,2,4,6,8]){ b[3][c]=mk('P','han'); b[6][c]=mk('P','cho'); }
  return b;
}
/* ===== 컴퓨터 ===== */
function evalBoard(b,s){let v=0;for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c]; if(!p) continue;
  let x=VAL[p.t]; if(p.t==='P') x+=0.12*(p.s==='cho'?6-r:r-3); if(p.t==='R'||p.t==='C'||p.t==='N') x+=0.05*(4-Math.abs(4-c));
  v+=p.s===s?x:-x;} return v;}
function negamax(b,s,d,a,be){
  if(d===0) return evalBoard(b,s);
  let best=-Infinity;
  for(const [fr,fc,tr,tc] of allPseudo(b,s)){
    const q=b[tr][tc]; if(q&&q.t==='K') return 1000+d;
    const sc=-negamax(apply(b,fr,fc,tr,tc),enemy(s),d-1,-be,-a);
    if(sc>best) best=sc; if(best>a) a=best; if(a>=be) break;
  }
  return best===-Infinity?0:best;
}
function aiMove(b,s,level){
  const moves=allLegal(b,s); if(!moves.length) return null;
  if(level==='easy'){
    const caps=moves.filter(m=>b[m[2]][m[3]]);
    if(caps.length&&Math.random()<0.55){caps.sort((a,z)=>VAL[b[z[2]][z[3]].t]-VAL[b[a[2]][a[3]].t]); return caps[0];}
    return moves[Math.floor(Math.random()*moves.length)];
  }
  /* 중간: 5번 중 2번은 아무렇게나 두고, 나머지는 한 수 앞(상대 응수)까지만 봐요 */
  if(level==='mid'&&Math.random()<0.4) return moves[Math.floor(Math.random()*moves.length)];
  const depth=level==='mid'?1:2, noise=level==='mid'?2.5:0.4;
  let best=null,bs=-Infinity;
  for(const m of moves){const nb=apply(b,...m); const sc=-negamax(nb,enemy(s),depth,-Infinity,Infinity)+Math.random()*noise; if(sc>bs){bs=sc;best=m;}}
  return best;
}

let AC=null;
function tone(f,d=0.12,type='sine',vol=0.18,delay=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay; o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);}catch(e){}}
const SFX={pick:()=>tone(660,.08,'triangle',.12), move:()=>tone(220,.12,'square',.08), cap:()=>{tone(330,.1,'square',.1);tone(180,.18,'square',.1,.08)},
  star:()=>{[784,988,1175].forEach((f,i)=>tone(f,.15,'triangle',.14,i*.08))}, win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.16,i*.12))},
  check:()=>{tone(880,.1,'sawtooth',.08);tone(880,.1,'sawtooth',.08,.15)}, no:()=>tone(150,.15,'sine',.12)};

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e;}
const X=c=>60+c*100, Y=r=>60+r*100;
function oct(R){const p=[];for(let k=0;k<8;k++){const a=Math.PI/8+k*Math.PI/4;p.push((R*Math.cos(a)).toFixed(1)+','+(R*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(R){const p=[];for(let k=0;k<10;k++){const rr=k%2?R*0.45:R,a=-Math.PI/2+k*Math.PI/5;p.push((rr*Math.cos(a)).toFixed(1)+','+(rr*Math.sin(a)).toFixed(1));}return p.join(' ');}

function makeView(svg,onTap){
  svg.setAttribute('viewBox','0 0 920 1020');
  el('rect',{x:6,y:6,width:908,height:1008,rx:30,class:'b-wood'},svg);
  for(const top of [0,7]) el('rect',{x:X(3),y:Y(top),width:200,height:200,class:'b-palace'},svg);
  const g=el('g',{class:'b-lines'},svg);
  for(let r=0;r<10;r++) el('line',{x1:X(0),y1:Y(r),x2:X(8),y2:Y(r)},g);
  for(let c=0;c<9;c++) el('line',{x1:X(c),y1:Y(0),x2:X(c),y2:Y(9)},g);
  for(const L of PLINES) el('line',{x1:X(L[0][1]),y1:Y(L[0][0]),x2:X(L[2][1]),y2:Y(L[2][0])},g);
  el('rect',{x:X(0),y:Y(0),width:800,height:900,class:'b-edge'},svg);
  const spots=[[2,1],[2,7],[7,1],[7,7]]; for(const r of [3,6]) for(const c of [0,2,4,6,8]) spots.push([r,c]);
  for(const [r,c] of spots){ for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ const cx=X(c)+sx*10, cy=Y(r)+sy*10; if((c===0&&sx<0)||(c===8&&sx>0)) continue;
    el('path',{d:`M${cx+sx*18} ${cy} L${cx} ${cy} L${cx} ${cy+sy*18}`,class:'b-mark'},svg);}}
  const v={svg,marks:el('g',{},svg),pieces:el('g',{},svg),hints:el('g',{},svg),map:new Map()};
  svg.addEventListener('click',e=>{const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=svg.getScreenCTM(); if(!m) return; const p=pt.matrixTransform(m.inverse());
    const c=Math.round((p.x-60)/100), r=Math.round((p.y-60)/100); if(!inB(r,c)) return;
    if(Math.hypot(p.x-X(c),p.y-Y(r))>58) return; onTap(r,c);});
  return v;
}
function pieceSVG(p,parent){
  const R=SIZE[p.t]; const g=el('g',{class:'pc '+p.s},parent);
  el('polygon',{points:oct(R),class:'pc-shadow',transform:'translate(0,6)'},g);
  el('polygon',{points:oct(R),class:'pc-face'},g);
  el('polygon',{points:oct(R-8),class:'pc-in'},g);
  const t=el('text',{x:0,y:2,'font-size':Math.round(R*1.12)},g); t.textContent=LABEL[p.s][p.t];
  return g;
}
function render(v,st){
  v.marks.replaceChildren(); v.hints.replaceChildren();
  if(st.last){ for(const [r,c] of st.last) el('circle',{cx:X(c),cy:Y(r),r:50,class:'last'},v.marks); }
  if(st.stars) for(const k of st.stars){const [r,c]=k.split(',').map(Number); el('polygon',{points:starPts(36),class:'star'},el('g',{transform:`translate(${X(c)},${Y(r)})`},v.marks));}
  if(st.check){const [r,c]=st.check; el('circle',{cx:X(c),cy:Y(r),r:54,class:'check-ring'},v.marks);}
  if(st.glow) for(const [r,c] of st.glow) el('circle',{cx:X(c),cy:Y(r),r:56,class:'glow'},v.marks);
  if(st.sel){const [r,c]=st.sel; el('circle',{cx:X(c),cy:Y(r),r:54,class:'sel-halo'},v.marks);}
  const seen=new Set();
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=st.b[r][c]; if(!p) continue; seen.add(p.id);
    let g=v.map.get(p.id); if(!g){g=pieceSVG(p,v.pieces); v.map.set(p.id,g);}
    g.style.transform=`translate(${X(c)}px,${Y(r)}px)`; }
  for(const [id,g] of v.map) if(!seen.has(id)){g.remove(); v.map.delete(id);}

function confetti(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const cols=['#FFB51C','#15774A','#C42D38','#4FA3E0','#FF7FB0']; const ps=Array.from({length:140},()=>({x:W/2,y:H*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let t=0; (function f(){ctx.clearRect(0,0,W,H); for(const p of ps){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}
    if(++t<110) requestAnimationFrame(f); else {ctx.clearRect(0,0,W,H); fx.hidden=true;}})();
}

/* 수업에서 갈 수 있는 곳: 별 수업은 다른 말 위로 못 가고, 어떤 수업이든 대장은 잡지 않아요 */
function lessonMoves(b,r,c,ls){ return legal(b,r,c).filter(([tr,tc])=>{const q=b[tr][tc]; if(!q) return true; if(q.t==='K') return false; return ls.goal!=='stars';}); }
/* 남은 별에 아직 갈 수 있는지 (움직일 말이 하나일 때) */
function starsReachable(){ const ls=LESSONS[L.idx]; if(ls.goal!=='stars'||!L.stars.size) return true;
  const mine=[]; for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=L.b[r][c]; if(p&&p.s==='cho'&&ls.movable.includes(p.t)) mine.push([r,c]);}
  if(mine.length!==1) return true;
  const [sr,sc]=mine[0], piece=L.b[sr][sc], base=clone(L.b); base[sr][sc]=null;
  const seen=new Set([sr+','+sc]), q=[[sr,sc]];
  while(q.length){ const [r,c]=q.shift(); base[r][c]=piece;
    for(const [tr,tc] of pseudo(base,r,c)){ if(base[tr][tc]) continue; const k=tr+','+tc; if(!seen.has(k)){seen.add(k); q.push([tr,tc]);} }
    base[r][c]=null; }
  for(const k of L.stars) if(!seen.has(k)) return false; return true; }
function lessonCount(){ const ls=LESSONS[L.idx];
  if(ls.goal==='stars') return `별 ${ls.stars.length-L.stars.size} / ${ls.stars.length}`;

  if(ls.goal==='capture'){let n=0; for(const row of L.b) for(const p of row) if(p&&p.s==='han') n++; return `남은 빨간 말 ${n}`;}
  return '';
}

  L.sel=null; L.moves=null; L.done=false; L.tapped=new Set(); L.last=null;
  L.stars=ls.stars?new Set(ls.stars.map(p=>p.join(','))):null;
  $('lEyebrow').textContent=`${i+1}번째 수업`; $('lTitle').textContent=ls.title; $('lText').textContent=ls.text;
  $('lNext').disabled=true; $('lNext').classList.remove('ready'); $('lReset').classList.remove('ready');
  $('lNext').textContent= i===LESSONS.length-1 ? '대련하러 가기 →' : '다음 수업 →';
  setLMsg(ls.goal==='explore'?'노랗게 반짝이는 초록 말을 하나 눌러 보세요.':ls.goal==='mate'?'반짝이는 차 중에서 하나를 골라 보세요.':'노랗게 반짝이는 말을 눌러서 시작해요.');
  buildChips(); drawLesson();
  try{localStorage.setItem('kj-lesson',String(i));}catch(e){}
}
function lessonGlow(){ const ls=LESSONS[L.idx]; if(L.done||L.sel) return null; const g=[];
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=L.b[r][c]; if(!p||p.s!=='cho') continue;
    if(ls.goal==='explore'){ if(!L.tapped.has(p.t)) g.push([r,c]); }
    else if(!ls.movable||ls.movable.includes(p.t)) g.push([r,c]); }
  return g; }
function drawLesson(){ $('lCount').textContent=lessonCount();
  render(lv,{b:L.b,sel:L.sel,moves:L.moves,stars:L.stars,last:L.last,glow:lessonGlow()}); }
function lessonWin(msg){ L.done=true; L.sel=null; L.moves=null; doneSet.add(L.idx); saveDone(); buildChips();
  setLMsg(msg,'good'); $('lNext').disabled=false; $('lNext').classList.add('ready'); SFX.win(); confetti(); speak(msg); }
function lessonTap(r,c){
  const ls=LESSONS[L.idx]; const p=L.b[r][c];
  if(ls.goal==='explore'){ if(!p) return; SFX.pick(); speak(`${LABEL[p.s][p.t]}. ${INFO[p.t].nick}. ${INFO[p.t].desc}`);
    L.sel=[r,c]; const fresh=!L.tapped.has(p.t); L.tapped.add(p.t);
    if(!L.done&&L.tapped.size===7){ drawLesson(); lessonWin('일곱 친구를 모두 만났어요! 참 잘했어요!'); return; }
    setLMsg(`${LABEL[p.s][p.t]} · ${INFO[p.t].nick}\n${INFO[p.t].desc}`, fresh&&!L.done?'':null, p);
    $('lMsg').innerHTML=`<b>${LABEL[p.s][p.t]} · ${INFO[p.t].nick}</b><br>${INFO[p.t].desc}`;
    drawLesson(); return; }
  if(L.done) return;
  if(L.sel&&L.moves&&L.moves.some(m=>m[0]===r&&m[1]===c)){
    const [fr,fc]=L.sel; const cap=L.b[r][c]; L.b=apply(L.b,fr,fc,r,c); L.last=[[fr,fc],[r,c]]; L.sel=null; L.moves=null;
    const key=r+','+c; let got=false; if(L.stars&&L.stars.has(key)){L.stars.delete(key); got=true;}
    if(ls.goal==='stars'){ if(L.stars.size===0){drawLesson(); lessonWin('별을 모두 모았어요! 최고예요!'); return;}
      if(!starsReachable()){ SFX.no(); const m='앗! 이제는 남은 별까지 갈 수 없어요. 처음부터 다시 해 볼까요?'; setLMsg(m,'warn'); speak(m); $('lReset').classList.add('ready'); drawLesson(); return; }
      if(got){SFX.star(); setLMsg('별을 잡았어요! 다음 별로 가 볼까요?');} else {SFX.move(); setLMsg('좋아요! 별이 있는 곳으로 가 보세요.');} }
    else if(ls.goal==='capture'){ if(cap){SFX.cap();} else SFX.move();
      let left=0; for(const row of L.b) for(const q of row) if(q&&q.s==='han') left++;
      if(left===0){drawLesson(); lessonWin('빨간 말을 모두 잡았어요! 대단해요!'); return;}
      setLMsg(cap?`${josa(nm(cap),'을','를')} 잡았어요! 다음 말도 잡아 봐요.`:'빨간 말이 있는 곳으로 가면 잡을 수 있어요.'); }
    else if(ls.goal==='mate'){
      const inCheck=attacked(L.b,'han'), noMoves=allLegal(L.b,'han').length===0;
      if(inCheck&&noMoves){ const k=findKing(L.b,'han'); drawLesson(); render(lv,{b:L.b,last:L.last,check:k}); lessonWin('외통이에요! 장기 박사 탄생!'); return; }
      SFX.no(); setLMsg(inCheck?'장군! 그런데 대장이 도망칠 수 있어요. 다시 해 봐요.':'아깝다! 대장을 공격하지 못했어요. 다시 해 봐요.','warn');
      drawLesson(); setTimeout(()=>{ if(L.idx===LESSONS.indexOf(ls)&&!L.done){ const keep=$('lMsg').textContent; loadLesson(L.idx); setLMsg(keep,'warn'); }},1500); return; }
    drawLesson(); return; }
  if(L.sel&&L.sel[0]===r&&L.sel[1]===c){ L.sel=null; L.moves=null; setLMsg('다시 골라 보세요.'); drawLesson(); return; }
  if(p&&p.s==='cho'&&(!ls.movable||ls.movable.includes(p.t))){
    const mv=lessonMoves(L.b,r,c,ls); L.sel=[r,c]; L.moves=mv; SFX.pick();
    setLMsg(mv.length?'노란 점 중 한 곳을 눌러 보세요.':'이 말은 지금 갈 곳이 없어요.'); drawLesson(); return; }
  if(p){ SFX.no(); setLMsg(p.s==='han'?'빨간 말은 이번 수업에서 쉬고 있어요.':`${josa(nm(p),'은','는')} 이번 수업에서 쉬고 있어요.`); }
  L.sel=null; L.moves=null; drawLesson();
}
$('lReset').onclick=()=>loadLesson(L.idx);
$('lHint').onclick=()=>{ const h=LESSONS[L.idx].hint; setLMsg(h); speak(h); };
$('lSpeak').onclick=()=>speak(LESSONS[L.idx].title+'. '+LESSONS[L.idx].text);
if(!canSpeak) $('lSpeak').hidden=true;
$('lNext').onclick=()=>{ if(L.idx<LESSONS.length-1) loadLesson(L.idx+1); else setTab('play'); };

/* ===== 대련 모드 ===== */
const G={b:null,turn:'cho',sel:null,moves:null,hist:[],capt:{cho:[],han:[]},last:null,over:false,opp:'easy',hints:true,busy:false,ply:0};
const gv=makeView($('gBoard'),gameTap);
try{ const o=localStorage.getItem('kj-opp'); if(o) G.opp=o; }catch(e){}
document.querySelectorAll('#oppSeg button').forEach(b=>{ b.setAttribute('aria-pressed',b.dataset.opp===G.opp);
  b.onclick=()=>{ G.opp=b.dataset.opp; document.querySelectorAll('#oppSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    try{localStorage.setItem('kj-opp',G.opp);}catch(e){} newGame();
    setGMsg(G.opp==='friend'?'둘이서 번갈아 둬요. 초록 팀부터 시작!':'나는 초록 팀, 컴퓨터는 빨간 팀이에요. 내가 먼저 둬요!'); }; });
$('showHints').onchange=e=>{G.hints=e.target.checked; renderGame();};
const TEAM={cho:'초록 팀',han:'빨간 팀'};
function setGMsg(t,kind){ $('gMsg').textContent=t; $('gStatus').className='status'+(kind?' '+kind:''); }
function newGame(){ resetView(gv); Object.assign(G,{b:startBoard(),turn:'cho',sel:null,moves:null,hist:[],capt:{cho:[],han:[]},last:null,over:false,busy:false,ply:0});
  setGMsg('초록 팀(초)이 먼저 시작해요. 움직일 말을 눌러 보세요.'); $('winBox').hidden=true; renderGame(); }
function trays(){ for(const s of ['cho','han']){ const box=$(s==='cho'?'trayCho':'trayHan'); box.replaceChildren();
  for(const p of G.capt[s]){ const sv=el('svg',{viewBox:'-50 -50 100 100',class:'mini'}); pieceSVG(p,sv).style.transform='none'; box.appendChild(sv);} } }
function renderGame(){
  $('turnDot').className='dot '+G.turn;
  const vs=G.opp!=='friend', ai=vs&&G.turn==='han';
  $('turnText').textContent=G.over?'게임 끝!':ai?'컴퓨터(빨강)가 생각 중…':vs?'내 차례 (초록)':TEAM[G.turn]+' 차례';
  $('trayChoLabel').textContent=vs?'내가 잡은 말':'초록 팀이 잡은 말';
  $('trayHanLabel').textContent=vs?'컴퓨터가 잡은 말':'빨간 팀이 잡은 말';
  const chk=attacked(G.b,G.turn)?findKing(G.b,G.turn):null;
  render(gv,{b:G.b,sel:G.sel,moves:G.moves,last:G.last,check:chk,showHints:G.hints}); trays();
}
function gameTap(r,c){
  if(G.over||G.busy) return; if(G.opp!=='friend'&&G.turn==='han') return;
  const p=G.b[r][c];
  if(G.sel&&G.moves&&G.moves.some(m=>m[0]===r&&m[1]===c)){ doMove(G.sel[0],G.sel[1],r,c); return; }
  if(G.sel&&G.sel[0]===r&&G.sel[1]===c){ G.sel=null; G.moves=null; setGMsg('다른 말을 골라도 돼요.'); renderGame(); return; }
  if(p&&p.s===G.turn){ const mv=legal(G.b,r,c); G.sel=[r,c]; G.moves=mv; SFX.pick();
    if(!mv.length) setGMsg(attacked(G.b,G.turn)?'장군이에요! 대장을 지킬 수 있는 말을 골라 보세요.':`${josa(nm(p),'은','는')} 지금 갈 곳이 없어요.`, 'warn');
    else setGMsg(`${INFO[p.t].name} · ${INFO[p.t].desc}`);
    renderGame(); return; }
  if(p&&p.s!==G.turn&&!G.sel){ SFX.no(); setGMsg(`지금은 ${TEAM[G.turn]} 차례예요.`); }
  G.sel=null; G.moves=null; renderGame();
}
function doMove(fr,fc,tr,tc){
  G.hist.push({b:G.b,turn:G.turn,capt:{cho:G.capt.cho.slice(),han:G.capt.han.slice()},last:G.last,ply:G.ply});
  const cap=G.b[tr][tc]; if(cap) G.capt[G.turn].push(cap);
  G.b=apply(G.b,fr,fc,tr,tc); G.last=[[fr,fc],[tr,tc]]; G.sel=null; G.moves=null; G.ply++;
  const mover=G.turn; G.turn=enemy(G.turn);
  const inCheck=attacked(G.b,G.turn), noMoves=allLegal(G.b,G.turn).length===0;
  if(noMoves){ G.over=true; renderGame(); SFX.win(); confetti();
    const vsAI=G.opp!=='friend';
    $('winTitle').textContent= vsAI ? (mover==='cho'?'내가 이겼어요!':'컴퓨터가 이겼어요') : TEAM[mover]+' 승리!';
    $('winSub').textContent= inCheck ? '외통이에요! 대장이 도망칠 곳이 없어요.' : '상대가 움직일 수 있는 말이 없어요.';
    setGMsg(TEAM[mover]+' 승리!','good'); speak($('winTitle').textContent); setTimeout(()=>{$('winBox').hidden=false;},700); return; }
  if(G.ply>=240){ G.over=true; setGMsg('너무 오래 뒀어요. 비겼어요!','good'); renderGame(); return; }
  const vs=G.opp!=='friend', who=s=>vs?(s==='cho'?'내가':'컴퓨터가'):TEAM[s]+'이';
  if(inCheck){ SFX.check(); setGMsg(vs&&G.turn==='cho'?'장군! 내 대장이 공격받고 있어요. 대장을 지켜요!':`장군! ${TEAM[G.turn]}은 대장을 지켜야 해요.`,'warn'); speak('장군!'); }
  else { cap?SFX.cap():SFX.move(); setGMsg(cap?`${who(mover)} ${josa(nm(cap),'을','를')} 잡았어요!`:vs?(G.turn==='cho'?'내 차례예요.':'컴퓨터가 생각 중이에요.'):`${TEAM[G.turn]} 차례예요.`); }
  renderGame();
  if(G.opp!=='friend'&&G.turn==='han'){ G.busy=true; setTimeout(()=>{ const m=aiMove(G.b,'han',G.opp); G.busy=false; if(m&&!G.over) doMove(...m); }, 450); }
}
$('gUndo').onclick=()=>{ if(G.busy||!G.hist.length) return; let h=G.hist.pop();
  if(G.opp!=='friend'&&h.turn==='han'&&G.hist.length) h=G.hist.pop();
  Object.assign(G,{b:h.b,turn:h.turn,capt:h.capt,last:h.last,ply:h.ply,over:false,sel:null,moves:null});
  $('winBox').hidden=true; setGMsg('한 수 물렀어요. 다시 생각해 봐요!'); renderGame(); };
$('gNew').onclick=newGame; $('winAgain').onclick=newGame; $('winClose').onclick=()=>{$('winBox').hidden=true;};

/* ===== 시작 ===== */
let startIdx=0; try{ startIdx=Math.min(LESSONS.length-1,parseInt(localStorage.getItem('kj-lesson')||'0',10)||0); }catch(e){}
loadLesson(startIdx); newGame();
let tab='learn'; try{ tab=localStorage.getItem('kj-tab')||'learn'; }catch(e){} setTab(tab);
</script>
